stages:
  - test
  - build
  - migrate
  - deploy

default:
  image: node:20-slim
  before_script:
    - npm ci

sast_scan:
  stage: test
  image: returntocorp/semgrep
  before_script: [] 
  script:
    - semgrep scan --config=p/owasp-top-10 --error
  rules:
    - if: $CI_COMMIT_BRANCH == "working"

build_app:
  stage: build
  script:
    - npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
    - npx vercel build --prod --token=$VERCEL_TOKEN
  artifacts:
    paths:
      - .vercel/output/
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == "working"

run_migrations:
  stage: migrate
  dependencies:
    - build_app
  script:
    - npx drizzle-kit migrate
  variables:
    DATABASE_URL: $DATABASE_URL
  rules:
    - if: $CI_COMMIT_BRANCH == "working"

deploy_prod:
  stage: deploy
  dependencies:
    - build_app
  script:
    - npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
  rules:
    - if: $CI_COMMIT_BRANCH == "working"